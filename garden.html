<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title data-i18n="meta.titleGarden">The Garden — Secret Garden</title>
<link rel="icon" type="image/svg+xml" href="img/favicon.svg" />
<link rel="stylesheet" href="css/tokens.css" />
<link rel="stylesheet" href="css/base.css" />
<link rel="stylesheet" href="css/garden.css" />
</head>
<body>

<span class="lang-switcher-fab" data-lang-switcher></span>

<a class="shovel-fab has-tooltip has-tooltip--end" id="shovelFab" href="plant.html" aria-label="Plant a Flower" data-i18n-aria-label="landing.ctaPlant">
  <svg viewBox="0 0 200 400" fill="none" aria-hidden="true">
    <defs>
      <linearGradient id="shovelWood" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%" stop-color="#f1d9ae"/>
        <stop offset="55%" stop-color="#dab97e"/>
        <stop offset="100%" stop-color="#b98f52"/>
      </linearGradient>
      <linearGradient id="shovelBlade" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%" stop-color="#eef1f5"/>
        <stop offset="50%" stop-color="#c7cbd3"/>
        <stop offset="100%" stop-color="#8c9099"/>
      </linearGradient>
    </defs>
    <g transform="rotate(16 100 200)">
      <path d="M72 10c0-9 12-9 28-9s28 0 28 9-12 9-28 9-28 0-28-9Z" fill="#1c1c1c"/>
      <rect x="76" y="4" width="48" height="7" rx="3.5" fill="#000" opacity="0.35"/>
      <path d="M76 18c-6 3-8 10-8 20l10 6c1-10 2-18 6-23Z" fill="#1c1c1c"/>
      <path d="M124 18c6 3 8 10 8 20l-10 6c-1-10-2-18-6-23Z" fill="#1c1c1c"/>
      <rect x="93" y="40" width="14" height="215" rx="6" fill="url(#shovelWood)" stroke="#8f6a37" stroke-width="1"/>
      <rect x="88" y="250" width="24" height="20" rx="3" fill="#4b4e56" stroke="#2c2e33" stroke-width="1.5"/>
      <path d="M62 268c0-6 17-9 38-9s38 3 38 9l-6 20c-5 15-14 27-22 40-3 5-9 5-12 0-8-13-17-25-22-40Z" fill="url(#shovelBlade)" stroke="#5b5e66" stroke-width="3" stroke-linejoin="round"/>
      <path d="M78 272c3 20 9 40 22 56" stroke="#fff" stroke-width="2" opacity="0.35" stroke-linecap="round"/>
    </g>
  </svg>
</a>

<button type="button" class="watering-can-fab has-tooltip has-tooltip--end" id="wateringCan" hidden
        aria-label="Read every letter" data-i18n-aria-label="garden.wateringCan"
        aria-haspopup="dialog" aria-controls="galleryOverlay">
  <svg viewBox="0 0 240 200" fill="none" aria-hidden="true">
    <defs>
      <linearGradient id="canBody" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%" stop-color="#b9d3a4"/>
        <stop offset="50%" stop-color="#8fb27c"/>
        <stop offset="100%" stop-color="#5f8452"/>
      </linearGradient>
      <linearGradient id="canSpout" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#a7c692"/>
        <stop offset="100%" stop-color="#5f8452"/>
      </linearGradient>
    </defs>
    <g class="watering-can-fab__drops" fill="#9fd4e4">
      <path d="M10 104c0-5 4-10 4-10s4 5 4 10a4 4 0 0 1-8 0Z"/>
      <path d="M26 120c0-5 4-10 4-10s4 5 4 10a4 4 0 0 1-8 0Z"/>
      <path d="M4 132c0-5 4-10 4-10s4 5 4 10a4 4 0 0 1-8 0Z"/>
    </g>
    <path d="M150 82c0-46 66-52 60 6-3 30-18 46-30 56" stroke="#4f7045" stroke-width="13" stroke-linecap="round"/>
    <path d="M150 82c0-46 66-52 60 6-3 30-18 46-30 56" stroke="#8fb27c" stroke-width="6" stroke-linecap="round"/>
    <path d="M74 150 26 78l12-8 46 60Z" fill="url(#canSpout)" stroke="#4f7045" stroke-width="3" stroke-linejoin="round"/>
    <g transform="rotate(-34 30 72)">
      <rect x="12" y="62" width="36" height="18" rx="7" fill="#c7cbd3" stroke="#5b5e66" stroke-width="3"/>
      <g fill="#5b5e66"><circle cx="20" cy="71" r="1.8"/><circle cx="27" cy="71" r="1.8"/><circle cx="34" cy="71" r="1.8"/><circle cx="41" cy="71" r="1.8"/></g>
    </g>
    <path d="M68 82h108l8 90c1 10-5 16-15 16H78c-10 0-16-6-15-16Z" fill="url(#canBody)" stroke="#4f7045" stroke-width="3" stroke-linejoin="round"/>
    <ellipse cx="122" cy="82" rx="56" ry="9" fill="#a7c692" stroke="#4f7045" stroke-width="3"/>
    <path d="M78 96c-2 24-1 50 3 76" stroke="#fff" stroke-width="4" stroke-linecap="round" opacity="0.35"/>
    <g transform="translate(124 136)">
      <g fill="#fffdf2" stroke="#d6cba6" stroke-width="1.2">
        <circle cx="0" cy="-11" r="8"/><circle cx="0" cy="-11" r="8" transform="rotate(72)"/><circle cx="0" cy="-11" r="8" transform="rotate(144)"/><circle cx="0" cy="-11" r="8" transform="rotate(216)"/><circle cx="0" cy="-11" r="8" transform="rotate(288)"/>
      </g>
      <circle r="6" fill="#f4b83c" stroke="#d9922a" stroke-width="1.2"/>
    </g>
  </svg>
</button>

<div class="gallery-overlay" id="galleryOverlay" hidden>
  <section class="gallery-panel" role="dialog" aria-modal="true" aria-labelledby="galleryTitle">
    <header class="gallery-panel__head">
      <h2 class="gallery-panel__title" id="galleryTitle" data-i18n="garden.galleryTitle">Every letter in the garden</h2>
      <button type="button" class="icon-btn icon-btn--sm has-tooltip has-tooltip--below has-tooltip--end" id="galleryClose" aria-label="Close" data-i18n-aria-label="garden.close">✕</button>
    </header>
    <ul class="gallery-grid" id="galleryGrid"></ul>
  </section>
</div>

<main class="garden-scene is-booting" id="gardenScene">
  <svg class="garden-scene__layer garden-scene__ground" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
    <rect x="0" y="0" width="1440" height="900" fill="#93a86e"/>
    <g id="grassTufts"></g>
    <g id="mushrooms"></g>
  </svg>

  <div class="garden-scene__layer garden-scene__tint" id="nightTint" aria-hidden="true"></div>

  <div class="garden-scene__layer garden-scene__plants" id="windLayer" aria-hidden="true"></div>

  <div class="garden-scene__layer garden-scene__plants" id="fireflyLayer" aria-hidden="true"></div>

  <div class="garden-scene__layer garden-scene__plants" id="plantLayer" style="z-index:6;"></div>

  <div class="garden-scene__layer garden-scene__rain" id="rainLayer" aria-hidden="true"></div>
</main>

<div class="detail-overlay" id="detailOverlay">
  <div class="detail-panel" role="dialog" aria-modal="true" id="detailPanel">
    <button type="button" class="detail-panel__trash has-tooltip has-tooltip--below has-tooltip--end" id="deleteFlowerBtn" hidden
            aria-label="Remove this flower" data-i18n-aria-label="garden.deleteFlower">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M4 7h16"/><path d="M9 7V4.5h6V7"/><path d="M6 7l1 13h10l1-13"/><path d="M10 11v5.5M14 11v5.5"/>
      </svg>
    </button>

    <div class="story-stack" id="storyStack" hidden>
      <div class="story-card story-card--stamp" id="stampCard" tabindex="0" role="button"
           aria-label="Bring the message card to the front" data-i18n-aria-label="garden.bringMessageForward">
        <div class="story-card--stamp__surface">
          <p class="detail-panel__meta" id="detailMeta">—</p>
          <h2 class="detail-panel__name" id="detailName">—</h2>
          <div class="detail-panel__letter" id="detailLetter">
            <p class="detail-panel__message" id="detailMessage">—</p>
          </div>
        </div>
      </div>

      <div class="story-card story-card--polaroid is-front" id="polaroidCard" tabindex="0" role="button"
           aria-label="Bring the drawing card to the front" data-i18n-aria-label="garden.bringPhotoForward">
        <div class="detail-panel__canvas-wrap">
          <svg id="replaySvg" viewBox="0 0 120 120"></svg>
        </div>
        <div class="detail-panel__controls">
          <div class="speed-dropdown speed-dropdown--sm" id="speedDropdown">
            <button type="button" class="speed-dropdown__trigger has-tooltip" id="speedDropdownTrigger"
                    aria-haspopup="listbox" aria-expanded="false" aria-label="Drawing speed" data-i18n-aria-label="garden.speedLabel">
              <span id="speedDropdownValue">1.0x</span>
            </button>
            <ul class="speed-dropdown__list" id="speedDropdownList" role="listbox" aria-label="Drawing speed" data-i18n-aria-label="garden.speedLabel" hidden>
              <li role="option" data-value="0.5">0.5x</li>
              <li role="option" data-value="1" aria-selected="true">1.0x</li>
              <li role="option" data-value="2">2x</li>
            </ul>
          </div>
          <button class="icon-btn icon-btn--sm has-tooltip" id="replayToggle" aria-label="Play" data-i18n-aria-label="garden.replayPlay">▶</button>
          <button class="icon-btn icon-btn--sm has-tooltip" id="replayAgain" aria-label="Replay from start" data-i18n-aria-label="garden.replayAgain">↺</button>
        </div>
      </div>
    </div>

    <!-- Sealed letters show only this envelope — no story cards, no replay,
         nothing but the seal, until the recipient's own doorway opens it. -->
    <div class="story-envelope" id="storyEnvelope" hidden>
      <svg class="story-envelope__flap" viewBox="0 0 300 130" preserveAspectRatio="none" aria-hidden="true">
        <path class="story-envelope__flap-fill" d="M0,0 L300,0 L300,4 L150,120 L0,4 Z"/>
        <path class="story-envelope__flap-line" d="M0,4 L150,120 L300,4"/>
      </svg>
      <p class="story-envelope__label" id="envelopeLabel" data-i18n="garden.envelopeFrom">A letter from</p>
      <p class="story-envelope__author" id="envelopeAuthor">—</p>
      <div class="story-envelope__seal" id="envelopeSealMount"></div>
      <p class="story-envelope__note" id="envelopeNote" data-i18n="garden.sealedNotice">This letter is sealed. Only the one it's meant for can open it.</p>
    </div>
  </div>
</div>

<!-- Delete confirmation -->
<div class="confirm-overlay" id="deleteConfirm" hidden>
  <section class="confirm-card" role="alertdialog" aria-modal="true" aria-labelledby="deleteConfirmTitle" aria-describedby="deleteConfirmText">
    <h2 class="confirm-card__title" id="deleteConfirmTitle" data-i18n="garden.deleteConfirmTitle">Remove this flower?</h2>
    <p class="confirm-card__text" id="deleteConfirmText">—</p>
    <p class="confirm-card__error" id="deleteConfirmError" role="alert" hidden></p>
    <div class="confirm-card__actions">
      <button type="button" class="btn btn--ghost" id="deleteCancelBtn" data-i18n="garden.deleteCancel">Keep it</button>
      <button type="button" class="btn btn--danger" id="deleteConfirmBtn" data-i18n="garden.deleteConfirm">Remove</button>
    </div>
  </section>
</div>

<p class="garden-status" id="gardenStatus" role="status" hidden></p>

<script type="module" src="js/garden.js"></script>
</body>
</html>
