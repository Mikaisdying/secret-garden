<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title data-i18n="meta.titleGarden">The Garden — Secret Garden</title>
<link rel="icon" type="image/svg+xml" href="img/favicon.svg" />
<link rel="stylesheet" href="css/tokens.css" />
<link rel="stylesheet" href="css/base.css" />
<link rel="stylesheet" href="css/garden.css" />
</head>
<body>

<a class="shovel-fab" href="plant.html" aria-label="Plant a Flower" data-i18n-aria-label="landing.ctaPlant" title="Plant a Flower" data-i18n-title="landing.ctaPlant">
  <svg viewBox="0 0 200 400" fill="none" aria-hidden="true">
    <defs>
      <linearGradient id="shovelWood" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%" stop-color="#f1d9ae"/>
        <stop offset="55%" stop-color="#dab97e"/>
        <stop offset="100%" stop-color="#b98f52"/>
      </linearGradient>
      <linearGradient id="shovelBlade" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%" stop-color="#eef1f5"/>
        <stop offset="50%" stop-color="#c7cbd3"/>
        <stop offset="100%" stop-color="#8c9099"/>
      </linearGradient>
    </defs>
    <g transform="rotate(16 100 200)">
      <path d="M72 10c0-9 12-9 28-9s28 0 28 9-12 9-28 9-28 0-28-9Z" fill="#1c1c1c"/>
      <rect x="76" y="4" width="48" height="7" rx="3.5" fill="#000" opacity="0.35"/>
      <path d="M76 18c-6 3-8 10-8 20l10 6c1-10 2-18 6-23Z" fill="#1c1c1c"/>
      <path d="M124 18c6 3 8 10 8 20l-10 6c-1-10-2-18-6-23Z" fill="#1c1c1c"/>
      <rect x="93" y="40" width="14" height="215" rx="6" fill="url(#shovelWood)" stroke="#8f6a37" stroke-width="1"/>
      <rect x="88" y="250" width="24" height="20" rx="3" fill="#4b4e56" stroke="#2c2e33" stroke-width="1.5"/>
      <path d="M62 268c0-6 17-9 38-9s38 3 38 9l-6 20c-5 15-14 27-22 40-3 5-9 5-12 0-8-13-17-25-22-40Z" fill="url(#shovelBlade)" stroke="#5b5e66" stroke-width="3" stroke-linejoin="round"/>
      <path d="M78 272c3 20 9 40 22 56" stroke="#fff" stroke-width="2" opacity="0.35" stroke-linecap="round"/>
    </g>
  </svg>
</a>

<main class="garden-scene" id="gardenScene">
  <svg class="garden-scene__layer garden-scene__ground" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
    <rect x="0" y="0" width="1440" height="900" fill="#93a86e"/>
    <g id="grassTufts"></g>
    <g id="mushrooms"></g>
  </svg>

  <div class="garden-scene__layer garden-scene__tint" id="nightTint" aria-hidden="true"></div>

  <div class="garden-scene__layer garden-scene__plants" id="windLayer" aria-hidden="true"></div>

  <div class="garden-scene__layer garden-scene__plants" id="fireflyLayer" aria-hidden="true"></div>

  <div class="garden-scene__layer garden-scene__plants" id="plantLayer" style="z-index:6;"></div>

  <div class="garden-scene__layer garden-scene__rain" id="rainLayer" aria-hidden="true"></div>
</main>

<div class="detail-overlay" id="detailOverlay">
  <div class="detail-panel" role="dialog" aria-modal="true" id="detailPanel">
    <div class="story-stack" id="storyStack" hidden>
      <div class="story-card story-card--stamp" id="stampCard" tabindex="0" role="button"
           aria-label="Bring the message card to the front" data-i18n-aria-label="garden.bringMessageForward">
        <div class="story-card--stamp__surface">
          <p class="detail-panel__meta" id="detailMeta">—</p>
          <h2 class="detail-panel__name" id="detailName">—</h2>
          <div class="detail-panel__letter" id="detailLetter">
            <p class="detail-panel__message" id="detailMessage">—</p>
          </div>
        </div>
      </div>

      <div class="story-card story-card--polaroid is-front" id="polaroidCard" tabindex="0" role="button"
           aria-label="Bring the drawing card to the front" data-i18n-aria-label="garden.bringPhotoForward">
        <div class="detail-panel__canvas-wrap">
          <svg id="replaySvg" viewBox="0 0 120 120"></svg>
        </div>
        <div class="detail-panel__controls">
          <button class="icon-btn icon-btn--sm" id="replayToggle" aria-label="Play" data-i18n-aria-label="garden.replayPlay">▶</button>
          <button class="icon-btn icon-btn--sm" id="replayAgain" aria-label="Replay from start" data-i18n-aria-label="garden.replayAgain">↺</button>
          <select class="speed-select speed-select--sm" id="replaySpeed" aria-label="Drawing speed" data-i18n-aria-label="garden.speedLabel">
            <option value="0.5" data-i18n="garden.speedSlow">Slow</option>
            <option value="1" selected data-i18n="garden.speedNormal">Normal</option>
            <option value="2" data-i18n="garden.speedFast">Fast</option>
          </select>
        </div>
      </div>
    </div>

    <!-- Sealed letters show only this envelope — no story cards, no replay,
         nothing but the seal, until the recipient's own doorway opens it. -->
    <div class="story-envelope" id="storyEnvelope" hidden>
      <svg class="story-envelope__flap" viewBox="0 0 300 130" preserveAspectRatio="none" aria-hidden="true">
        <path class="story-envelope__flap-fill" d="M0,0 L300,0 L300,4 L150,120 L0,4 Z"/>
        <path class="story-envelope__flap-line" d="M0,4 L150,120 L300,4"/>
      </svg>
      <p class="story-envelope__label" id="envelopeLabel" data-i18n="garden.envelopeFrom">A letter from</p>
      <p class="story-envelope__author" id="envelopeAuthor">—</p>
      <div class="story-envelope__seal" id="envelopeSealMount"></div>
      <p class="story-envelope__note" id="envelopeNote" data-i18n="garden.sealedNotice">This letter is sealed. Only the one it's meant for can open it.</p>
    </div>
  </div>
</div>

<script type="module" src="js/garden.js"></script>
</body>
</html>
